[project]
name = "ricky"
version = "0.8.17"
description = "A personal agentic assistant and agent harness."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex Meyer", email = "alex.j.meyer15@gmail.com" }]
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3,<0.28",
    "rich>=15.0.0",
    "prompt-toolkit>=3.0.53",
    "httpx>=0.28.1",
    "tomlkit>=0.15.2",
    "pyyaml>=6.0.3",
    "playwright>=1.64.1,<1.65",
    "pillow>=13.0.0",
    "cryptography>=50.0.2",
]

[project.scripts]
ricky = "ricky.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ricky"]
exclude = ["/src/ricky/builtins/skills/ricky-docs/references"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ricky", "/docs", "/scripts/bundle_docs.py", "/hatch_build.py",
    "/pyproject.toml", "/uv.lock", "/README.md", "/ricky.toml.example",
    "/.secrets.toml.example",
]
exclude = ["/src/ricky/builtins/skills/ricky-docs/references"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports (enforces boundary discipline later)
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -n 4 --dist loadgroup --durations=10 --strict-markers"
markers = [
    "browser_integration: requires the host-installed Google Chrome Stable",
    "release_integration: builds and installs isolated historical releases with uv",
    "real_bundled_resources: discovers the real skills, workflows, and jobs shipped with Ricky",
]
