[project]
name = "ricky"
version = "0.8.0"
description = "A personal agentic assistant and agent harness."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex Meyer", email = "alex.j.meyer15@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.52",
    "httpx>=0.27",
    "tomlkit>=0.15.1",
    "pyyaml>=6.0.3",
    "playwright>=1.59",
    "pillow>=12.3.0",
    "cryptography>=46",
]

[project.scripts]
ricky = "ricky.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ricky"]
exclude = ["/src/ricky/builtins/skills/ricky-docs/references"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ricky", "/docs", "/scripts/bundle_docs.py", "/hatch_build.py",
    "/pyproject.toml", "/uv.lock", "/README.md", "/ricky.toml.example",
    "/.secrets.toml.example",
]
exclude = ["/src/ricky/builtins/skills/ricky-docs/references"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports (enforces boundary discipline later)
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser_integration: requires the host-installed Google Chrome Stable",
    "real_bundled_resources: discovers the real skills, workflows, and jobs shipped with Ricky",
]
